{{ partial "page-header" . }}

<div class="post-header">
  <div class="container">
    <div class="content">
      <h2>Posts for {{ .Title }}</h2>
    </div>
  </div>
</div>

<div class="container">
  <ul>
    {{ range where .Pages "Type" "post" }}
      <li><a href="{{ .Permalink }}">{{ .Title }}</a> <span class="text-xs">{{ .Date.Format "Jan 2, 2006" }}</span></li>
    {{ end }}
  </ul>
</div>

{{ partial "footer" . }}
