{{ partial "page-header" . }}

<div class="post-header">
  <div class="container">
    <div class="content">
      {{ partial "shared/page/breadcrumbs" . }}
      <h2>Posts</h2>
    </div>
  </div>
</div>

<div class="container">
  <ul>
    {{ range .Pages.ByDate.Reverse }}
      <li><a href="{{ .Permalink }}">{{ .Title }}</a> <span class="text-xs">{{ .Date.Format "Jan 2, 2006" }}</span></li>
    {{ end }}
  </ul>
</div>

{{ partial "footer" . }}
